<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Börsen-Ratespiel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>📈 Börsen-Ratespiel</h1>
      <p class="subtitle">Simulierter Kursverlauf. Geht es als Nächstes rauf oder runter?</p>
    </header>

    <div class="stats">
      <div class="stat"><span class="label">Runde</span><span id="round" class="value">1</span></div>
      <div class="stat"><span class="label">Punkte</span><span id="score" class="value">0</span></div>
      <div class="stat"><span class="label">Serie</span><span id="streak" class="value">0</span></div>
      <div class="stat"><span class="label">Bestserie</span><span id="best" class="value">0</span></div>
    </div>

    <div class="chart-wrap">
      <canvas id="chart" width="800" height="360"></canvas>
      <div id="banner" class="banner hidden"></div>
    </div>

    <div class="controls">
      <button id="btnUp" class="btn up">📈 Rauf</button>
      <button id="btnDown" class="btn down">📉 Runter</button>
      <button id="btnNext" class="btn next hidden">Nächste Runde →</button>
    </div>

    <p class="hint">Hinweis: Die Kursverläufe sind zufällig simuliert (kein echtes Marktdaten-Feed) — nur zum Üben deines Gefühls für Trends, Volatilität und Rauschen.</p>
  </div>
  <script src="script.js"></script>
</body>
</html>
